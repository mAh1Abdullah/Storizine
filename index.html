    <script>
      (function() {
        // AI Studio Preview Iframe: Shim Vite HMR WebSocket to satisfy @vite/client without proxy drop
        if (typeof window !== 'undefined' && window.WebSocket) {
          const NativeWebSocket = window.WebSocket;
          function ViteHmrWebSocket(url, protocols) {
            const isViteHmr = protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('/@vite/client')));
            if (isViteHmr) {
              const target = new EventTarget();
              const ws = {
                url: String(url),
                readyState: 1, // WebSocket.OPEN
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                send: function() {},
                close: function() {
                  ws.readyState = 3;
                  target.dispatchEvent(new Event('close'));
                },
                addEventListener: function(type, listener, options) {
                  target.addEventListener(type, listener, options);
                },
                removeEventListener: function(type, listener, options) {
                  target.removeEventListener(type, listener, options);
                },
                dispatchEvent: function(event) {
                  return target.dispatchEvent(event);
                }
              };
              setTimeout(function() {
                target.dispatchEvent(new Event('open'));
              }, 10);
              return ws;
            }
            return new NativeWebSocket(url, protocols);
          }
          ViteHmrWebSocket.CONNECTING = 0;
          ViteHmrWebSocket.OPEN = 1;
          ViteHmrWebSocket.CLOSING = 2;
          ViteHmrWebSocket.CLOSED = 3;
          ViteHmrWebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket = ViteHmrWebSocket;
        }

        // Error suppression guard for Vite WebSocket notices in iframe
        const _err = console.error;
        console.error = function(...args) {
          const msg = args.map(a => (a && a.message) || String(a)).join(' ');
          if (msg.includes('WebSocket closed without opened') || (msg.includes('[vite]') && msg.includes('websocket'))) {
            return;
          }
          _err.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          if (e.message && e.message.includes('WebSocket closed without opened')) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          const msg = (e.reason && e.reason.message) || String(e.reason || '');
          if (msg.includes('WebSocket closed without opened')) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
