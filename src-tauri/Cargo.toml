[package]
name = "storizine"
version = "1.0.0"
description = "Storizine & BookForest - Modern Literary Magazine, Book Collector Sanctuary, and Foliate Reader Engine"
authors = ["Storizine Authors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
